<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMarket - Обратная связь</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            background-color: #f7cdcd;
            padding: 20px;
            border-bottom: 3px solid #d99c9c;
            text-align: center;
        }
        header nav a {
            text-decoration: none;
            color: #2c3e50;
            margin-right: 12px;
        }
        header nav a:hover {
            text-decoration: underline;
            color: #0000ff;
        }
        #cart-count {
            background-color: #c97b7b;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 5px;
            vertical-align: middle;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .feedback-section {
            background-color: #fdf5f5;
            border-radius: 10px;
            border: 3px solid #f7cdcd;
            padding: 32px;
        }
        .feedback-section h1 {
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #c97b7b;
            box-shadow: 0 0 0 3px rgba(201, 123, 123, 0.15);
            background-color: #fff;
        }
        .feedback-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-weight: bold;
            margin-bottom: 6px;
            color: #2c3e50;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 14px;
            border: 2px solid #e8dff0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: #fdf8f3;
            color: #2c3e50;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .btn-submit {
            padding: 14px 40px;
            background-color: #c97b7b;
            color: #fff;
            border: 2px solid #b06565;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            justify-self: start;
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
        }
        .btn-submit:hover {
            background-color: #b06565;
            border-color: #965050;
        }
        footer {
            border-top: 3px solid #d99c9c;
            background-color: #f7cdcd;
            padding: 20px;
            text-align: center;
        }
        footer a {
            padding: 6px 10px;
            text-decoration: none;
            color: #2d2d3a;
        }
        footer a:hover {
            text-decoration: underline;
            color: #0000ff;
        }
        @media (max-width: 850px) {
            .feedback-form {
                grid-template-columns: 1fr;
            }
            .form-group.full {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>
    <header>
        <h2>TechMarket</h2>
        <form>
            <input type="search" size="40">
            <button>Поиск</button>
        </form> 
        <nav>
            <a href="index.html">Главная</a>
            <a href="catalog-t.html">Каталог</a>
            <a href="infa.html">О нас</a>
            <a href="korz.html">Корзина<span id="cart-count">0</span></a>
            <a href="oplata.html">Способы оплаты</a>
        </nav> 
    </header>
    <main>
        <div class="container">
            <section class="feedback-section">
                <h1>💬 Обратная связь</h1>
                <form class="feedback-form" action="#" method="POST">
                    <div class="form-group">
                        <label for="user-name">Имя</label>
                        <input type="text" id="user-name" name="name" placeholder="Ваше имя" required>
                    </div>
                    <div class="form-group">
                        <label for="user-email">Email</label>
                        <input type="email" id="user-email" name="email" placeholder="example@mail.ru" required>
                    </div>
                    <div class="form-group full">
                        <label for="user-subject">Тема сообщения</label>
                        <select id="user-subject" name="subject" required>
                            <option value="" disabled selected>Выберите тему</option>
                            <option value="order">Вопрос по заказу</option>
                            <option value="delivery">Доставка</option>
                            <option value="quality">Качество продукции</option>
                            <option value="cooperation">Сотрудничество</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label for="user-message">Сообщение</label>
                        <textarea id="user-message" name="message" placeholder="Напишите ваше сообщение..." required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">Отправить</button>
                </form>
            </section>
        </div>
    </main>
    <footer>
        <p id="info">Контакты: <a href="mailto:TechMarket@gmail.com">TechMarket@gmail.com</a>  <a href="tel:+89999999999"> 8 999 999 99 99</a>  <a href="form.html">Обратная связь </a></p>
        <p>&copy; 2026 TechMarket. Все права защищены.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const countElement = document.getElementById('cart-count');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            countElement.innerText = totalItems;
        });
    </script>
</body>
</html>
